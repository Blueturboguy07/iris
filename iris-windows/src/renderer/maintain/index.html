<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <title>Iris — maintain mode</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      Maintain mode's entire visible surface: one card, one sentence of
      evidence, three answers — the Windows port of MaintainAskCard.swift.
      It renders nothing (the whole window stays hidden — see
      main/index.ts's showMaintainCard/hideMaintainCard) when there is
      nothing to ask, which is almost always, by design. The rate limits
      live in incident-coordinator.ts; this file only draws what survived
      them.

      The three answers are deliberate and none is a dismissal-x: "that was
      me" is a labeled negative the pool learns from, and "don't ask about
      this app" is a real, permanent setting — not a snooze. A question a
      user cannot decisively end is a nag.
    -->
    <div class="shell" id="shell">
      <section class="card ask-card" id="ask-card" hidden>
        <header class="ask-header">
          <span class="badge" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="14" height="14">
              <path
                d="M3 10.5 8 5.5 10 7.5 13.5 4 16.5 7 13 10.5 15 12.5 10 17.5 8 15.5 4.5 19 1.5 16Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <h1 id="ask-title">Something wrong?</h1>
        </header>

        <p class="evidence" id="ask-evidence"></p>

        <!-- A cache hit means someone else already fixed this exact break —
             say so before the user even answers, because "a fix exists"
             changes what "yes" means. -->
        <p class="known-fix" id="ask-known-fix" hidden>A known fix exists for this.</p>

        <div class="actions ask-actions">
          <button class="primary" id="ask-yes" type="button">Yes, something's broken</button>
          <button class="text" id="ask-no" type="button">No, that was me</button>
          <span class="spacer"></span>
          <button class="text" id="ask-dont-ask" type="button">Don't ask</button>
        </div>
      </section>

      <!-- After a "yes": what the fix attempt is doing / did, for the card. -->
      <section class="card fix-card" id="fix-card" hidden>
        <p class="status" id="fix-status"></p>
        <ol class="steps" id="fix-steps" hidden></ol>
        <div class="actions">
          <span class="spacer"></span>
          <button class="text" id="fix-done" type="button">Done</button>
        </div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
