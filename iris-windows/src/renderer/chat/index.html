<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- No remote scripts, fonts, or styles: a packaged desktop app should not
       reach the network to render its own chrome. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
  <title>Iris</title>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: rgba(255, 255, 255, 0.04);
      --bg-tertiary: rgba(255, 255, 255, 0.06);
      --bg-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 140, 255, 0.5);
      --text-primary: #f0f0f5;
      --text-secondary: rgba(255, 255, 255, 0.55);
      --text-tertiary: rgba(255, 255, 255, 0.3);
      --accent: #638cff;
      --accent-hover: #7da0ff;
      --error: #f87171;
      --warn: #fbbf24;
      --msg-user: linear-gradient(135deg, #638cff 0%, #5a7af5 100%);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      font-size: 13px;
    }

    #titlebar {
      height: 44px;
      padding: 0 8px 0 16px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    #titlebar .name { font-weight: 600; letter-spacing: 0.01em; }
    #titlebar .tier {
      color: var(--text-tertiary);
      font-size: 11px;
      margin-left: auto;
      padding-right: 6px;
    }
    /* A publik API balance under $0.25: a warning, never a block. */
    #titlebar .tier.low { color: var(--warn); }
    .win-btn {
      -webkit-app-region: no-drag;
      width: 30px; height: 28px;
      border: 0; border-radius: var(--radius-sm);
      background: transparent; color: var(--text-secondary);
      cursor: pointer; font-size: 14px; line-height: 1;
    }
    .win-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .win-btn svg { display: block; margin: auto; }

    #messages { flex: 1; overflow-x: hidden; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    /* A thin scrollbar in the app's colours for the conversation, instead of
       Windows' wide grey default. scrollbar-width/-color must stay unset:
       Chromium ignores these rules once either is set. */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14); background-clip: padding-box;
      border: 2px solid transparent; border-radius: 8px; min-height: 40px;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.26); }
    ::-webkit-scrollbar-corner { background: transparent; }
    .msg { max-width: 88%; padding: 9px 12px; border-radius: var(--radius-md); line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--msg-user); color: #fff; }
    .msg.assistant { align-self: flex-start; background: var(--bg-secondary); border: 1px solid var(--border); }
    .msg.system { align-self: center; color: var(--text-tertiary); font-size: 11px; text-align: center; max-width: 100%; }
    .msg.error { align-self: flex-start; background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); color: var(--error); }
    .msg .add-credit {
      display: block; margin-top: 8px; padding: 6px 12px; border: 0; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 12px; font-family: inherit;
    }
    .msg .add-credit:hover { background: var(--accent-hover); }

    #welcome { margin: auto; text-align: center; color: var(--text-secondary); padding: 24px; line-height: 1.6; }
    #welcome h2 { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }

    #setup { padding: 16px; border-top: 1px solid var(--border); display: none; flex-direction: column; gap: 10px; }
    #setup.visible { display: flex; }
    #setup .row { display: flex; gap: 8px; }
    #setup p { color: var(--text-secondary); line-height: 1.5; }
    button.primary {
      flex: 1; padding: 9px 12px; border: 0; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 12px;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.secondary {
      flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-secondary); color: var(--text-primary); cursor: pointer; font-size: 12px;
    }
    button.secondary:hover { background: var(--bg-hover); }
    input[type=text], input[type=password] {
      flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-secondary); color: var(--text-primary); font-size: 12px; font-family: inherit; outline: none;
    }
    input:focus { border-color: var(--border-focus); }

    #status { padding: 0 16px 6px; color: var(--text-tertiary); font-size: 11px; height: 18px; }

    #input-area { padding: 12px 16px 16px; display: flex; gap: 8px; border-top: 1px solid var(--border); flex-shrink: 0; }
    #send {
      width: 36px; border: 0; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; cursor: pointer; font-size: 15px;
    }
    #send:hover { background: var(--accent-hover); }
    #send:disabled { opacity: 0.4; cursor: default; }

    /* Inline cards — the usage disclosure and the one publik API suggestion.
       In the flow of the window, never a modal, never over the input. */
    .inline-card {
      margin: 10px 16px 0; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: var(--radius-md); background: var(--bg-secondary); display: none; flex-shrink: 0;
    }
    .inline-card.visible { display: block; }
    .inline-card h3 { font-size: 12px; margin-bottom: 4px; }
    .inline-card p { color: var(--text-secondary); font-size: 12px; line-height: 1.5; margin-bottom: 8px; }
    .inline-card .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .inline-card label { color: var(--text-primary); font-size: 12px; display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .inline-card button.primary, .inline-card button.secondary { flex: 0 0 auto; padding: 6px 12px; }
  </style>
</head>
<body>
  <div id="titlebar">
    <span class="name">Iris</span>
    <span class="tier" id="tier"></span>
    <button class="win-btn" id="guide-btn" title="Install guide">&#9776;</button>
    <!-- Settings in one click from the chat. Before, the only way in was the
         tray icon's right-click menu, and on Windows 11 that icon hides
         behind the ^ arrow by the clock. An inline SVG, not a gear
         character, which Windows would draw as a colour emoji. -->
    <button class="win-btn" id="settings-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor">
        <!-- Eight teeth: one thick dashed ring (circumference 41.5 / 8). -->
        <circle cx="10" cy="10" r="7" stroke-width="2.8" stroke-dasharray="2.75 2.75"></circle>
        <circle cx="10" cy="10" r="5" stroke-width="1.6"></circle>
        <circle cx="10" cy="10" r="1.9" stroke-width="1.5"></circle>
      </svg>
    </button>
    <button class="win-btn" id="min-btn" title="Minimize">&#8211;</button>
    <button class="win-btn" id="close-btn" title="Close">&#10005;</button>
  </div>

  <!-- The anonymous usage disclosure, until it is answered. Its switch starts
       on; counting starts once it has been on screen (`main/usage.ts`). -->
  <div class="inline-card" id="usage-disclosure">
    <h3>Anonymous usage counts</h3>
    <p id="usage-disclosure-text"></p>
    <label><input type="checkbox" id="usage-disclosure-switch" checked> Share anonymous usage counts</label>
    <div class="row">
      <button class="primary" id="usage-continue">Continue</button>
      <button class="secondary" id="usage-turn-off">Turn off</button>
    </div>
  </div>

  <div id="messages">
    <div id="welcome">
      <h2>Ask about your screen</h2>
      <div>Iris reads what is on screen and points at what you need.</div>
    </div>
  </div>

  <div id="setup">
    <p id="setup-text">Set up publik API, or add your own Anthropic key.</p>
    <div class="row">
      <button class="primary" id="publik-setup">Set up publik API</button>
    </div>
    <div class="row">
      <input type="password" id="byo-key" placeholder="…or paste an Anthropic API key">
      <button class="secondary" id="save-key" style="flex:0 0 auto">Save</button>
    </div>
  </div>

  <!-- The session's one publik API suggestion. The question already went. -->
  <div class="inline-card" id="nudge-card">
    <h3 id="nudge-headline"></h3>
    <p id="nudge-detail"></p>
    <div class="row">
      <button class="primary" id="nudge-compare">Compare in Settings</button>
      <button class="secondary" id="nudge-not-now" title="Hides suggestions like this for 7 days.">Not now</button>
    </div>
  </div>

  <div id="status"></div>

  <div id="input-area">
    <input type="text" id="input" placeholder="Ask about your screen..." autofocus>
    <button id="send" title="Send">&#10148;</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const welcomeEl = document.getElementById('welcome');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const setupEl = document.getElementById('setup');
    const setupTextEl = document.getElementById('setup-text');
    const tierEl = document.getElementById('tier');

    function addMessage(text, kind) {
      if (welcomeEl && welcomeEl.parentNode) welcomeEl.remove();
      const el = document.createElement('div');
      el.className = 'msg ' + kind;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function showStatus(text) {
      statusEl.textContent = text || '';
    }

    async function refreshAccountState() {
      const settings = await window.iris.getSettings();
      // Signing in no longer buys a model: the funded tier is gone, so what
      // matters is whether this install has a credential of its own.
      const hasCredentials = settings.hasPublikApiKey || settings.hasAnthropicApiKey;
      setupEl.classList.toggle('visible', !hasCredentials);
      tierEl.textContent = settings.hasPublikApiKey
        ? 'publik API'
        : settings.hasAnthropicApiKey ? 'your Anthropic key' : '';
      tierEl.title = '';
      tierEl.classList.remove('low');
      renderPublikBalance(settings.publikBalance);

      if (!settings.buildCanProvisionAutomatically) {
        document.getElementById('publik-setup').disabled = true;
        setupTextEl.textContent = 'Paste an Anthropic key, or a publik API key from your dashboard in Settings.';
      }
      if (!settings.secretStorageAvailable) {
        setupTextEl.textContent = 'Windows will not let Iris encrypt stored secrets on this machine, so a key cannot be saved safely.';
        document.getElementById('save-key').disabled = true;
        document.getElementById('publik-setup').disabled = true;
      }
      return settings;
    }

    /**
     * The balance beside the provider name — "publik API · $1.84 left" —
     * with what a message costs on hover. Null (a reader on their own key or
     * on codex) leaves the title exactly as it was.
     */
    function renderPublikBalance(balance) {
      if (!balance) return;
      tierEl.textContent = balance.balanceLine ? 'publik API · ' + balance.balanceLine : 'publik API';
      tierEl.title = balance.costLine;
      tierEl.classList.toggle('low', Boolean(balance.isLow));
    }

    async function refreshPublikBalance() {
      renderPublikBalance(await window.iris.refreshPublikBalance());
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      sendBtn.disabled = true;
      addMessage(text, 'user');
      showStatus('Reading screen…');
      try {
        const response = await window.iris.sendQuery(text);
        addMessage(response || '(no answer)', 'assistant');
      } catch (error) {
        // The main process already turned this into a sentence meant for a
        // person; a raw status code never reaches here. It is read back from
        // the main process because an invoke rejection carries only a
        // prefixed message — and not the one link a 402 comes with.
        const failure = await window.iris.lastChatFailure();
        const errorEl = addMessage(
          failure && failure.message
            ? failure.message
            : String(error && error.message ? error.message : error),
          'error'
        );
        if (failure && failure.addCreditUrl) {
          const addCreditButton = document.createElement('button');
          addCreditButton.className = 'add-credit';
          addCreditButton.textContent = 'Add credit';
          addCreditButton.addEventListener('click', () => window.iris.openExternal(failure.addCreditUrl));
          errorEl.appendChild(addCreditButton);
        }
        await refreshAccountState();
      } finally {
        sendBtn.disabled = false;
        showStatus('');
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }
    });

    document.getElementById('publik-setup').addEventListener('click', async () => {
      const button = document.getElementById('publik-setup');
      button.disabled = true;
      showStatus('Setting up publik API…');
      const result = await window.iris.provisionPublikApi();
      button.disabled = false;
      showStatus('');
      if (!result.ok) {
        addMessage(result.message, 'error');
        return;
      }
      // Section 12 (1): the balance, the reason, and the link — before a
      // single request is allowed to spend the starter.
      addMessage(
        result.card.balanceLine + ' — ' + result.card.whyItCosts,
        'system'
      );
      if (result.card.buttonUrl) {
        addMessage(result.card.buttonLabel + ': ' + result.card.buttonUrl, 'system');
      }
      await window.iris.markPublikCardShown();
      await refreshAccountState();
    });
    document.getElementById('save-key').addEventListener('click', async () => {
      const keyInput = document.getElementById('byo-key');
      const key = keyInput.value.trim();
      if (!key) return;
      const stored = await window.iris.setSetting('anthropicApiKey', key);
      keyInput.value = '';
      if (stored) {
        addMessage('Key saved. It is encrypted with Windows DPAPI and never sent to publik.', 'system');
      } else {
        addMessage('Iris could not encrypt that key on this machine, so it was not saved.', 'error');
      }
      await refreshAccountState();
    });

    document.getElementById('guide-btn').addEventListener('click', () => window.iris.openGuide());
    document.getElementById('settings-btn').addEventListener('click', () => window.iris.openSettings());
    document.getElementById('min-btn').addEventListener('click', () => window.iris.minimizeWindow());
    document.getElementById('close-btn').addEventListener('click', () => window.iris.closeWindow());

    // MARK: Anonymous usage counts

    document.getElementById('usage-disclosure-text').textContent =
      'Iris shares anonymous usage counts (which catalog apps you open and which AI tier you pick) ' +
      'to improve recommendations. No content, no identity.';

    function renderUsage(view) {
      document.getElementById('usage-disclosure').classList.toggle('visible', Boolean(view && view.showDisclosure));
    }
    async function loadUsage() {
      let view = await window.iris.usageState();
      if (view.showDisclosure) view = await window.iris.usageDisclosureShown();
      renderUsage(view);
    }
    document.getElementById('usage-continue').addEventListener('click', async () =>
      renderUsage(await window.iris.setUsageSharing(document.getElementById('usage-disclosure-switch').checked)));
    document.getElementById('usage-turn-off').addEventListener('click', async () =>
      renderUsage(await window.iris.setUsageSharing(false)));
    window.iris.onUsageChanged((view) => renderUsage(view));

    // MARK: The one publik API suggestion

    function renderNudge(nudge) {
      const card = document.getElementById('nudge-card');
      if (!nudge) {
        card.classList.remove('visible');
        return;
      }
      document.getElementById('nudge-headline').textContent = nudge.headline;
      document.getElementById('nudge-detail').textContent = nudge.detail;
      card.classList.add('visible');
    }
    document.getElementById('nudge-compare').addEventListener('click', async () => {
      await window.iris.nudgeActedOn();
      renderNudge(null);
      window.iris.openSettings();
    });
    document.getElementById('nudge-not-now').addEventListener('click', async () => {
      await window.iris.dismissNudge();
      renderNudge(null);
    });
    window.iris.onNudgeChanged((nudge) => renderNudge(nudge));

    window.iris.onStage(({ label }) => showStatus(label));
    window.iris.onAccountChanged(() => refreshAccountState());
    window.iris.onPublikBalanceChanged((balance) => renderPublikBalance(balance));
    // Coming back to the window is when the reader looks at the balance.
    window.addEventListener('focus', () => { refreshPublikBalance(); });

    refreshAccountState().then(() => refreshPublikBalance());
    loadUsage();
    window.iris.currentNudge().then((nudge) => renderNudge(nudge));
  </script>
</body>
</html>
