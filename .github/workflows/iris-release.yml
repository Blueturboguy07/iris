name: Release Iris

# Produces the downloadable Iris installers and, when the signing secrets are
# present, signs and notarizes them. Every job ends by installing what it just
# built and checking it opens — a build that cannot be opened is worse than no
# build, because it looks finished.
#
# Secrets (all optional; missing ones downgrade to an unsigned build):
#
#   macOS — deliberately the same names NitroAI uses, so the same five values
#   can be copied straight across:
#     CSC_LINK                      base64 of the Developer ID .p12
#     CSC_KEY_PASSWORD              its export password
#     APPLE_ID                      Apple account email
#     APPLE_APP_SPECIFIC_PASSWORD   app-specific password from appleid.apple.com
#     APPLE_TEAM_ID                 R5R3ZS54LV
#
#   Windows — Azure Artifact Signing (formerly Trusted Signing). There is no
#   .pfx path any more: since June 2023 the CA/Browser rules keep code-signing
#   keys on an HSM, so a certificate file alone cannot sign in CI.
#     AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID
#     AZURE_SIGNING_ENDPOINT        e.g. https://wus2.codesigning.azure.net
#     AZURE_SIGNING_ACCOUNT
#     AZURE_SIGNING_PROFILE

on:
  push:
    tags:
      - "iris-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installers to a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # macOS ships the Swift app. It used to ship iris-desktop (Tauri) from a job
  # that uploaded it under the artifact name `iris-macos`, while this job built
  # the real app into an artifact nothing ever published — so every release
  # handed users a guide viewer frozen since 2026-08-10 instead of the
  # assistant. Repointed 2026-08-25.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same keychain dance as build-macos above; the identity and secrets are
      # shared. Kept in sync by hand — if you touch one, touch both.
      - name: Set up macOS code signing
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No signing certificate configured — building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/iris-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security import build-resources/apple-developer-id-intermediates.pem -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "The certificate imported but no Developer ID Application identity came with it." >&2
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # PUBLIK_APP_TOKEN is a build setting, which Info.plist's PublikAppToken
      # entry expands (`$(PUBLIK_APP_TOKEN)`). Unset, it expands to empty and
      # PublikAPIAccount.buildAppToken falls back to the paste route, which is
      # the supported state for a build with no token. Passed on the command
      # line rather than committed: `iris` is a public repo.
      #
      # A local release does the same thing with its own token — see
      # iris-macos/scripts/release-app-token.sh, since macOS releases are cut
      # by hand where this secret is unreachable.
      - name: Build Iris.app
        working-directory: iris-macos
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLIK_APP_TOKEN:-}" ]; then
            echo "Baking a ${#PUBLIK_APP_TOKEN}-character publik app token into Info.plist."
          else
            echo "No PUBLIK_APP_TOKEN secret — this build falls back to the paste route."
          fi
          if [ "$SIGNED" = "true" ]; then
            xcodebuild -project leanring-buddy.xcodeproj -scheme leanring-buddy \
              -configuration Release -derivedDataPath build \
              PUBLIK_APP_TOKEN="${PUBLIK_APP_TOKEN:-}" \
              CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
              CODE_SIGN_STYLE=Manual \
              ENABLE_HARDENED_RUNTIME=YES \
              OTHER_CODE_SIGN_FLAGS="--timestamp" \
              build
          else
            xcodebuild -project leanring-buddy.xcodeproj -scheme leanring-buddy \
              -configuration Release -derivedDataPath build \
              PUBLIK_APP_TOKEN="${PUBLIK_APP_TOKEN:-}" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
              build
          fi
          test -d "build/Build/Products/Release/Iris.app"

      # Sparkle ships its helpers ALREADY signed — ad-hoc — and Xcode's
      # CODE_SIGN_IDENTITY does not reach inside a prebuilt framework to redo
      # them. So Autoupdate, Updater.app and both XPC services went to Apple
      # ad-hoc signed while the main binary was Developer ID, and notarization
      # came back `Invalid` with nothing in the build log to explain it.
      #
      # Inside-out order is not optional: signing a container invalidates the
      # signature of anything signed inside it afterwards.
      - name: Re-sign Sparkle's nested helpers
        if: steps.signing.outputs.signed == 'true'
        working-directory: iris-macos
        run: |
          set -euo pipefail
          SPARKLE="build/Build/Products/Release/Iris.app/Contents/Frameworks/Sparkle.framework"
          [ -d "$SPARKLE" ] || { echo "No Sparkle.framework — nothing to re-sign."; exit 0; }
          for target in \
            "$SPARKLE/Versions/B/XPCServices/Downloader.xpc" \
            "$SPARKLE/Versions/B/XPCServices/Installer.xpc" \
            "$SPARKLE/Versions/B/Updater.app" \
            "$SPARKLE/Versions/B/Autoupdate" \
            "$SPARKLE/Versions/B/Sparkle" \
            "$SPARKLE" \
            "build/Build/Products/Release/Iris.app"
          do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime --timestamp "$target"
          done
          # Every Mach-O must now carry a Developer ID and the hardened runtime,
          # or the submission is rejected again.
          while IFS= read -r binary; do
            codesign -dv --verbose=2 "$binary" 2>&1 | grep -q "^Authority=Developer ID Application" \
              || { echo "::error::$binary is not Developer ID signed"; exit 1; }
            codesign -dv --verbose=2 "$binary" 2>&1 | grep -q "runtime" \
              || { echo "::error::$binary lacks the hardened runtime"; exit 1; }
          done < <(find "build/Build/Products/Release/Iris.app" -type f \
                     -exec sh -c 'file "$1" | grep -q "Mach-O" && echo "$1"' _ {} \;)

      - name: Package dmg
        working-directory: iris-macos
        run: |
          set -euo pipefail
          mkdir -p dist/dmg-root
          cp -R "build/Build/Products/Release/Iris.app" dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "Iris" -srcfolder dist/dmg-root -ov -format UDZO \
            "dist/Iris-assistant.dmg"

          # Sign the IMAGE too, not just the app inside it. Apple's order is
          # sign -> notarize -> staple, and a disk image that carries no
          # signature of its own still staples fine — but `spctl --assess` on
          # the file people actually download then reports "rejected, source=no
          # usable signature". The app inside assesses as Notarized Developer
          # ID either way, which is why this went unnoticed through 0.3.x.
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp \
              "dist/Iris-assistant.dmg"
          fi

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        working-directory: iris-macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ]; then
            echo "Signed but no notary credentials — skipping notarization."
            exit 0
          fi
          xcrun notarytool submit dist/Iris-assistant.dmg \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/Iris-assistant.dmg
          # Assess what will actually be downloaded, not just what is inside it.
          spctl --assess --type open --context context:primary-signature -vv \
            dist/Iris-assistant.dmg

      # Independent of Apple notarization: this is Sparkle's OWN signature,
      # checked by every running copy of Iris against SUPublicEDKey before it
      # will install an update (leanring_buddyApp.swift's startSparkleUpdater).
      # `-p` prints nothing but the raw base64 EdDSA signature — no XML, no
      # length/version metadata — which is exactly the contract
      # app/api/iris/appcast/route.ts (in the publik repo) expects to find
      # next to each release's dmg: <asset-filename>.edsig, signature only.
      # The emptiness check is in the script, NOT in an `if:`. GitHub does not
      # expose the `secrets` context to step-level `if` conditions, and a
      # workflow that references it there does not fail that step — the whole
      # RUN is rejected before anything executes, with only "this run likely
      # failed because of a workflow file issue" to go on. That took out every
      # release run, macOS and Windows alike, until 0.9.12 caught it.
      - name: Sign the dmg for Sparkle self-update
        working-directory: iris-macos
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "No SPARKLE_ED_PRIVATE_KEY set — skipping the Sparkle signature."
            echo "The appcast skips a release whose dmg has no .edsig beside it,"
            echo "so this build simply will not be offered as an update."
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP" bin/sign_update
          SIGNATURE="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/bin/sign_update" --ed-key-file - -p dist/Iris-assistant.dmg)"
          printf '%s' "$SIGNATURE" > dist/Iris-assistant.dmg.edsig

      - name: Check the build opens
        working-directory: iris-macos
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Iris.app"
          if [ "$SIGNED" = "true" ]; then
            codesign --verify --deep --strict "$APP"
            spctl --assess --type execute "$APP" || {
              echo "Gatekeeper rejected the app (expected until notarization succeeds on a stapled copy)."
              [ -n "${APPLE_ID:-}" ] && exit 1 || true
            }
          fi
          open "$APP"
          sleep 5
          pgrep -x Iris >/dev/null
          osascript -e 'tell application "Iris" to quit' || pkill -x Iris || true

      - name: Record whether the app was signed
        run: |
          echo "${{ steps.signing.outputs.signed }}" > iris-macos/dist/macos-signed.txt

      - uses: actions/upload-artifact@v4
        with:
          name: iris-macos
          path: |
            iris-macos/dist/Iris-assistant.dmg
            iris-macos/dist/macos-signed.txt
          if-no-files-found: error

      # Separate artifact, separate failure mode: the .edsig only exists when
      # SPARKLE_ED_PRIVATE_KEY is set, so its absence must never fail the job
      # the way a missing dmg should.
      - uses: actions/upload-artifact@v4
        with:
          name: iris-macos-edsig
          path: iris-macos/dist/Iris-assistant.dmg.edsig
          if-no-files-found: ignore

  # Windows ships the Electron app. It used to ship iris-desktop (Tauri) — a
  # guide viewer with no maintain mode, no autopilot fix ladder and no edit
  # loop — under the artifact name `iris-windows`, while the real Windows
  # client was built only by iris-windows.yml into a 14-day artifact nobody
  # released. Repointed 2026-08-25.
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: iris-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: iris-windows/package-lock.json

      - name: Prefer https for git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install
        run: npm ci

      # A tag must not outrun a red branch: iris-windows.yml runs these on every
      # push, and running them here means a release cannot skip them.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Substituted AFTER the suite runs, so the tests keep exercising the
      # empty default (the shipping state for any build without a token), and
      # BEFORE `npm run make`, so the packaged bundle carries the real one.
      #
      # The token is public by construction — it ships inside every binary —
      # but it is still injected rather than committed, because `iris` is a
      # public repo and a token in git history is harvestable by everyone at
      # once instead of by whoever unpacks an installer.
      #
      # The missing-secret check is in the script, NOT in an `if:`. GitHub does
      # not expose the `secrets` context to step-level `if`, and referencing it
      # there does not skip the step — it rejects the whole run before anything
      # executes. That took out every release run until 0.9.12 caught it; do
      # not reintroduce the shape here.
      - name: Bake the publik app token
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUBLIK_APP_TOKEN:-}" ]; then
            echo "No PUBLIK_APP_TOKEN secret — shipping without one."
            echo "Auto-provisioning stays off and every install falls back to"
            echo "pasting a key from publikhq.com/dashboard/api."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const file = "src/main/publik-app-token.ts";
            const token = process.env.PUBLIK_APP_TOKEN.trim();
            if (!token.startsWith("pat_iris_")) {
              console.error("PUBLIK_APP_TOKEN is not a pat_iris_ token; refusing to bake it.");
              process.exit(1);
            }
            const before = fs.readFileSync(file, "utf8");
            const target = `const BAKED_APP_TOKEN = "";`;
            if (!before.includes(target)) {
              console.error("Could not find the BAKED_APP_TOKEN placeholder in " + file + ".");
              console.error("Someone changed its shape — fix this step rather than shipping an empty token.");
              process.exit(1);
            }
            // JSON.stringify, not string concatenation: it is the escaping the
            // value has to survive to remain a valid TS string literal.
            const after = before.replace(target, "const BAKED_APP_TOKEN = " + JSON.stringify(token) + ";");
            fs.writeFileSync(file, after);
            console.log("Baked a " + token.length + "-character app token into " + file + ".");
          '

      - name: Make the installer
        run: npm run make

      # Azure Artifact Signing, the same account and secrets the Tauri build
      # used. Missing secrets downgrade to unsigned, as everywhere else here;
      # `publish` then states it on the release rather than blocking it.
      #
      # KNOWN GAP: this signs the Squirrel setup executable only. Tauri applied
      # its sign command during bundling, so the Tauri build signed the
      # application binaries themselves. Doing the same here needs a
      # `windowsSign` hook in forge.config.ts; until that exists, an INSTALLED
      # copy still carries unsigned executables even when this step succeeds.
      - name: Sign the installer
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_SIGNING_ENDPOINT) {
            Write-Host 'No Azure signing account configured - leaving the installer unsigned.'
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          cargo install trusted-signing-cli --locked
          $installers = @(Get-ChildItem -Path out/make -Recurse -Filter *.exe)
          if ($installers.Count -eq 0) { throw 'npm run make produced no .exe to sign' }
          foreach ($installer in $installers) {
            trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT `
              -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE `
              -d Iris $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($installer.Name)" }
          }
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The rule this whole workflow is built on: a build that cannot be opened
      # is worse than no build, because it looks finished.
      - name: Check the app opens
        shell: pwsh
        run: |
          npm run package
          $exe = Get-ChildItem -Path out -Recurse -Filter Iris.exe | Select-Object -First 1
          if (-not $exe) { throw 'no packaged Iris.exe was produced' }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "Iris.exe exited on launch with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Record whether the installer was signed
        shell: pwsh
        run: '"${{ steps.signing.outputs.signed }}" | Set-Content out/make/windows-signed.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: iris-windows
          path: |
            iris-windows/out/make/**/*.exe
            iris-windows/out/make/windows-signed.txt
          if-no-files-found: error

  # Publishing is DELIBERATE, never a side effect of pushing a tag.
  #
  # This repo has no signing secrets (`gh secret list` is empty), so the build
  # jobs above downgrade to unsigned — and this job ends in
  # `gh release upload --clobber`. On a tag that combination replaces a DMG
  # signed and notarized on a real Mac with an unsigned CI build, silently, a
  # few minutes after the release goes up. It has been caught twice by hand:
  # the 0.3.1 and 0.3.2 runs were both cancelled mid-flight for this reason,
  # which is not a safeguard, it is a person being quick.
  #
  # So a tag now builds and verifies but does not publish. Releasing is either
  # local (build, sign, notarize, staple, `gh release create`) or an explicit
  # workflow_dispatch with publish=true. Once the secrets exist and CI can
  # produce a signed build, `startsWith(github.ref, 'refs/tags/')` can come
  # back and this comment can go.
  publish:
    needs: [build-macos, build-windows]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iris-macos
          path: release-assets/macos
      - uses: actions/download-artifact@v4
        with:
          name: iris-macos-edsig
          path: release-assets/macos
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: iris-windows
          path: release-assets/windows
      # Iris is meant to be a signed application on both platforms. It is not
      # signed yet, and that must not stop a release — but it must not be
      # invisible either, because an unsigned build is the one where the user
      # meets Gatekeeper or SmartScreen instead of the app and concludes it is
      # malware. So an unsigned platform is stated on the release itself, and
      # the note disappears on its own once the secrets exist.
      - name: Work out what got signed
        id: signing
        run: |
          macos="$(cat release-assets/macos/macos-signed.txt 2>/dev/null || echo unknown)"
          windows="$(cat release-assets/windows/windows-signed.txt 2>/dev/null || echo unknown)"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

          notes="Publik's desktop assistant for macOS and Windows."
          warn=""
          if [ "$macos" != "true" ]; then
            warn="$warn\n- **macOS build is not signed or notarized.** Gatekeeper will refuse it on first open; right-click → Open, or \`xattr -dr com.apple.quarantine\`."
          fi
          if [ "$windows" != "true" ]; then
            warn="$warn\n- **Windows installer is not signed.** SmartScreen will warn on download; More info → Run anyway."
          fi
          if [ -n "$warn" ]; then
            notes="$notes\n\n### Signing\n$warn\n\nIris is meant to be signed on both platforms. These notes go away once the signing secrets are configured."
            echo "::warning::Publishing an unsigned build (macOS signed: $macos, Windows signed: $windows)"
          fi
          {
            echo "notes<<IRIS_NOTES_EOF"
            printf "%b\n" "$notes"
            echo "IRIS_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IRIS_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.signing.outputs.notes }}
        run: |
          gh release view "$IRIS_TAG" >/dev/null 2>&1 || \
            gh release create "$IRIS_TAG" \
              --title "Iris ${IRIS_TAG#iris-v}" \
              --notes "$RELEASE_NOTES"
          gh release upload "$IRIS_TAG" \
            release-assets/macos/*.dmg \
            $(find release-assets/windows -name '*.exe') \
            $(find release-assets/macos -name '*.edsig' 2>/dev/null) \
            --clobber
