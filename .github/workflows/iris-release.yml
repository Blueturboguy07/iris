name: Release Iris

# Produces the downloadable Iris installers and, when the signing secrets are
# present, signs and notarizes them. Every job ends by installing what it just
# built and checking it opens — a build that cannot be opened is worse than no
# build, because it looks finished.
#
# Secrets (all optional; missing ones downgrade to an unsigned build):
#
#   macOS — deliberately the same names NitroAI uses, so the same five values
#   can be copied straight across:
#     CSC_LINK                      base64 of the Developer ID .p12
#     CSC_KEY_PASSWORD              its export password
#     APPLE_ID                      Apple account email
#     APPLE_APP_SPECIFIC_PASSWORD   app-specific password from appleid.apple.com
#     APPLE_TEAM_ID                 R5R3ZS54LV
#
#   Windows — Azure Artifact Signing (formerly Trusted Signing). There is no
#   .pfx path any more: since June 2023 the CA/Browser rules keep code-signing
#   keys on an HSM, so a certificate file alone cannot sign in CI.
#     AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID
#     AZURE_SIGNING_ENDPOINT        e.g. https://wus2.codesigning.azure.net
#     AZURE_SIGNING_ACCOUNT
#     AZURE_SIGNING_PROFILE

on:
  push:
    tags:
      - "iris-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installers to a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile

      # A .p12 carries only the leaf certificate. Without Apple's Developer ID
      # intermediate the chain is untrusted, and codesign fails in a way that is
      # easy to mistake for a bad password — so the intermediates are checked in
      # and imported alongside it.
      - name: Set up macOS code signing
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No signing certificate configured — building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/iris-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security import build-resources/apple-developer-id-intermediates.pem -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # codesign only searches the keychains in the user search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "The certificate imported but no Developer ID Application identity came with it." >&2
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # Tauri reads APPLE_PASSWORD; the secret keeps NitroAI's name so one
          # value serves both repositories.
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/build-iris-macos.sh --target universal-apple-darwin --bundles app,dmg

      - name: Check the build installs and opens
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ "$SIGNED" = "true" ] && [ -n "$NOTARY_ID" ]; then
            scripts/verify-iris-macos.sh --require-notarized
          elif [ "$SIGNED" = "true" ]; then
            scripts/verify-iris-macos.sh --require-signed
          else
            # No certificate configured: still prove the thing builds and opens,
            # just do not claim it is distributable.
            scripts/verify-iris-macos.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: iris-macos
          path: iris-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile

      # Signing is layered on with --config rather than committed to
      # tauri.conf.json, so a fork or a secret-less run still produces a build
      # instead of failing on a sign command it cannot run.
      - name: Set up Windows code signing
        id: signing
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_SIGNING_ENDPOINT) {
            Write-Host 'No Azure signing account configured - building unsigned.'
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          cargo install trusted-signing-cli --locked
          $command = "trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT " +
            "-a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE -d Iris %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 5
          $path = Join-Path $env:RUNNER_TEMP 'iris-signing.json'
          $config | Set-Content -Path $path -Encoding utf8
          "config=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        shell: pwsh
        working-directory: iris-desktop
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          SIGN_CONFIG: ${{ steps.signing.outputs.config }}
        run: |
          $buildArgs = @('build', '--bundles', 'nsis')
          if ($env:SIGNED -eq 'true') {
            $buildArgs += @('--config', $env:SIGN_CONFIG)
          }
          & ..\node_modules\.bin\tauri.cmd @buildArgs

      - name: Check the build installs and opens
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if ($env:SIGNED -eq 'true') {
            pwsh scripts/verify-iris-windows.ps1 -RequireSigned
          } else {
            pwsh scripts/verify-iris-windows.ps1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: iris-windows
          path: iris-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iris-macos
          path: release-assets/macos
      - uses: actions/download-artifact@v4
        with:
          name: iris-windows
          path: release-assets/windows
      - name: Publish desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IRIS_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$IRIS_TAG" >/dev/null 2>&1 || \
            gh release create "$IRIS_TAG" \
              --title "Iris ${IRIS_TAG#iris-v}" \
              --notes "Publik's desktop installation companion for macOS and Windows."
          gh release upload "$IRIS_TAG" \
            release-assets/macos/*.dmg \
            release-assets/windows/*.exe \
            --clobber
