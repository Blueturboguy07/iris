name: Release Iris

# Produces the downloadable Iris installers. The macOS artifact is published
# only after distribution signing, notarization, stapling, and a strict
# downloaded-copy check all pass. Every job ends by checking what it built
# opens. A build that cannot be opened is worse than no build, because it looks
# finished.
#
# macOS distribution secrets are required for the customer release path. A
# missing value fails the macOS job; it never downgrades that artifact to
# unsigned or unstapled. The names deliberately match NitroAI's so the same
# values can be managed in one place:
#
#   CSC_LINK                      base64 of the Developer ID .p12
#   CSC_KEY_PASSWORD              its export password
#   APPLE_ID                      Apple account email
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password from appleid.apple.com
#   APPLE_TEAM_ID                 expected Developer ID/notary team identifier
#
#   Windows — Azure Artifact Signing (formerly Trusted Signing). There is no
#   .pfx path any more: since June 2023 the CA/Browser rules keep code-signing
#   keys on an HSM, so a certificate file alone cannot sign in CI.
#     AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID
#     AZURE_SIGNING_ENDPOINT        e.g. https://wus2.codesigning.azure.net
#     AZURE_SIGNING_ACCOUNT
#     AZURE_SIGNING_PROFILE

on:
  push:
    tags:
      - "iris-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installers to a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # macOS ships the Swift app. It used to ship iris-desktop (Tauri) from a job
  # that uploaded it under the artifact name `iris-macos`, while this job built
  # the real app into an artifact nothing ever published — so every release
  # handed users a guide viewer frozen since 2026-08-10 instead of the
  # assistant. Repointed 2026-08-25.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Import only a Developer ID identity for the customer artifact. All five
      # values are checked before any build can produce a release candidate.
      - name: Set up macOS code signing
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::macOS customer release requires signing and notarization configuration; missing:$missing" >&2
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/iris-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security import build-resources/apple-developer-id-intermediates.pem -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "The certificate imported but no Developer ID Application identity came with it." >&2
            exit 1
          fi
          if ! printf '%s\n' "$IDENTITY" | grep -Fq "($APPLE_TEAM_ID)"; then
            echo "The imported Developer ID identity is not issued to the configured Apple team." >&2
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Iris.app
        working-directory: iris-macos
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project leanring-buddy.xcodeproj -scheme leanring-buddy \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build
          test -d "build/Build/Products/Release/Iris.app"

      # Sparkle ships its helpers ALREADY signed — ad-hoc — and Xcode's
      # CODE_SIGN_IDENTITY does not reach inside a prebuilt framework to redo
      # them. So Autoupdate, Updater.app and both XPC services went to Apple
      # ad-hoc signed while the main binary was Developer ID, and notarization
      # came back `Invalid` with nothing in the build log to explain it.
      #
      # Inside-out order is not optional: signing a container invalidates the
      # signature of anything signed inside it afterwards.
      - name: Re-sign Sparkle's nested helpers
        working-directory: iris-macos
        run: |
          set -euo pipefail
          SPARKLE="build/Build/Products/Release/Iris.app/Contents/Frameworks/Sparkle.framework"
          [ -d "$SPARKLE" ] || { echo "No Sparkle.framework — nothing to re-sign."; exit 0; }
          for target in \
            "$SPARKLE/Versions/B/XPCServices/Downloader.xpc" \
            "$SPARKLE/Versions/B/XPCServices/Installer.xpc" \
            "$SPARKLE/Versions/B/Updater.app" \
            "$SPARKLE/Versions/B/Autoupdate" \
            "$SPARKLE/Versions/B/Sparkle" \
            "$SPARKLE" \
            "build/Build/Products/Release/Iris.app"
          do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime --timestamp "$target"
          done
          # Every Mach-O must now carry a Developer ID and the hardened runtime,
          # or the submission is rejected again.
          while IFS= read -r binary; do
            codesign -dv --verbose=2 "$binary" 2>&1 | grep -q "^Authority=Developer ID Application" \
              || { echo "::error::$binary is not Developer ID signed"; exit 1; }
            codesign -dv --verbose=2 "$binary" 2>&1 | grep -q "runtime" \
              || { echo "::error::$binary lacks the hardened runtime"; exit 1; }
          done < <(find "build/Build/Products/Release/Iris.app" -type f \
                     -exec sh -c 'file "$1" | grep -q "Mach-O" && echo "$1"' _ {} \;)

      # Notarize the app before packaging it. This leaves a stapled app inside
      # the dmg, rather than stapling only a copy that never reaches users.
      - name: Notarize and staple Iris.app
        working-directory: iris-macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Iris.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Iris.app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Iris.app.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Package dmg
        working-directory: iris-macos
        run: |
          set -euo pipefail
          mkdir -p dist/dmg-root
          cp -R "build/Build/Products/Release/Iris.app" dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "Iris" -srcfolder dist/dmg-root -ov -format UDZO \
            "dist/Iris-assistant.dmg"

          # Sign the IMAGE too, not just the app inside it. Apple's order is
          # sign -> notarize -> staple, and a disk image that carries no
          # signature of its own still staples fine — but `spctl --assess` on
          # the file people actually download then reports "rejected, source=no
          # usable signature". The app inside assesses as Notarized Developer
          # ID either way, which is why this went unnoticed through 0.3.x.
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp \
            "dist/Iris-assistant.dmg"

      - name: Notarize and staple dmg
        working-directory: iris-macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/Iris-assistant.dmg \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/Iris-assistant.dmg
          xcrun stapler validate dist/Iris-assistant.dmg
          # Assess what will actually be downloaded, not just what is inside it.
          spctl --assess --type open --context context:primary-signature -vv \
            dist/Iris-assistant.dmg

      - name: Check the build opens
        working-directory: iris-macos
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Iris.app"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute "$APP"
          open "$APP"
          sleep 5
          pgrep -x Iris >/dev/null
          osascript -e 'tell application "Iris" to quit' || pkill -x Iris || true

      - name: Verify macOS distribution artifact
        env:
          IRIS_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          scripts/verify-iris-macos.sh \
            --app "iris-macos/build/Build/Products/Release/Iris.app" \
            --dmg "iris-macos/dist/Iris-assistant.dmg" \
            --expected-team "$IRIS_EXPECTED_TEAM_ID" \
            --expected-bundle-id "com.publikhq.iris" \
            --require-notarized

      - name: Record macOS distribution readiness
        run: |
          echo true > iris-macos/dist/macos-distribution-ready.txt

      - uses: actions/upload-artifact@v4
        with:
          name: iris-macos
          path: |
            iris-macos/dist/Iris-assistant.dmg
            iris-macos/dist/macos-distribution-ready.txt
          if-no-files-found: error

  # Windows ships the Electron app. It used to ship iris-desktop (Tauri) — a
  # guide viewer with no maintain mode, no autopilot fix ladder and no edit
  # loop — under the artifact name `iris-windows`, while the real Windows
  # client was built only by iris-windows.yml into a 14-day artifact nobody
  # released. Repointed 2026-08-25.
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: iris-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: iris-windows/package-lock.json

      - name: Prefer https for git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install
        run: npm ci

      # A tag must not outrun a red branch: iris-windows.yml runs these on every
      # push, and running them here means a release cannot skip them.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Make the installer
        run: npm run make

      # Azure Artifact Signing, the same account and secrets the Tauri build
      # used. Missing secrets downgrade to unsigned, as everywhere else here;
      # `publish` then states it on the release rather than blocking it.
      #
      # KNOWN GAP: this signs the Squirrel setup executable only. Tauri applied
      # its sign command during bundling, so the Tauri build signed the
      # application binaries themselves. Doing the same here needs a
      # `windowsSign` hook in forge.config.ts; until that exists, an INSTALLED
      # copy still carries unsigned executables even when this step succeeds.
      - name: Sign the installer
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_SIGNING_ENDPOINT) {
            Write-Host 'No Azure signing account configured - leaving the installer unsigned.'
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          cargo install trusted-signing-cli --locked
          $installers = @(Get-ChildItem -Path out/make -Recurse -Filter *.exe)
          if ($installers.Count -eq 0) { throw 'npm run make produced no .exe to sign' }
          foreach ($installer in $installers) {
            trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT `
              -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE `
              -d Iris $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($installer.Name)" }
          }
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The rule this whole workflow is built on: a build that cannot be opened
      # is worse than no build, because it looks finished.
      - name: Check the app opens
        shell: pwsh
        run: |
          npm run package
          $exe = Get-ChildItem -Path out -Recurse -Filter Iris.exe | Select-Object -First 1
          if (-not $exe) { throw 'no packaged Iris.exe was produced' }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "Iris.exe exited on launch with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Record whether the installer was signed
        shell: pwsh
        run: '"${{ steps.signing.outputs.signed }}" | Set-Content out/make/windows-signed.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: iris-windows
          path: |
            iris-windows/out/make/**/*.exe
            iris-windows/out/make/windows-signed.txt
          if-no-files-found: error

  # Publishing is DELIBERATE, never a side effect of pushing a tag.
  #
  # A tag builds but does not publish. Releasing is an explicit
  # workflow_dispatch with publish=true, and the macOS artifact must carry the
  # readiness marker written only after the strict downloaded-copy verifier.
  publish:
    needs: [build-macos, build-windows]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iris-macos
          path: release-assets/macos
      - uses: actions/download-artifact@v4
        with:
          name: iris-windows
          path: release-assets/windows
      # macOS is the customer release gate. Windows remains informational here
      # so its existing signing behavior is unchanged.
      - name: Verify macOS release gate
        id: signing
        run: |
          set -euo pipefail
          macos="$(cat release-assets/macos/macos-distribution-ready.txt 2>/dev/null || echo unknown)"
          if [ "$macos" != "true" ]; then
            echo "::error::Refusing to publish: macOS artifact did not pass the signed and notarized release gate." >&2
            exit 1
          fi
          windows="$(cat release-assets/windows/windows-signed.txt 2>/dev/null || echo unknown)"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

          notes="Publik's desktop assistant for macOS and Windows."
          warn=""
          if [ "$windows" != "true" ]; then
            warn="$warn\n- **Windows installer is not signed.** SmartScreen will warn on download; More info → Run anyway."
          fi
          if [ -n "$warn" ]; then
            notes="$notes\n\n### Signing\n$warn\n\nIris is meant to be signed on both platforms. These notes go away once the signing secrets are configured."
            echo "::warning::Publishing an unsigned build (macOS signed: $macos, Windows signed: $windows)"
          fi
          {
            echo "notes<<IRIS_NOTES_EOF"
            printf "%b\n" "$notes"
            echo "IRIS_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IRIS_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.signing.outputs.notes }}
        run: |
          gh release view "$IRIS_TAG" >/dev/null 2>&1 || \
            gh release create "$IRIS_TAG" \
              --title "Iris ${IRIS_TAG#iris-v}" \
              --notes "$RELEASE_NOTES"
          gh release upload "$IRIS_TAG" \
            release-assets/macos/*.dmg \
            $(find release-assets/windows -name '*.exe') \
            --clobber
